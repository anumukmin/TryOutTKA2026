<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRY OUT TKA 2026 - SMK NEGERI 1 BULAKAMBA</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                            800: '#0c4a6e',
                            900: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- KaTeX CSS & JS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            user-select: none;
            -webkit-user-select: none;
        }
        input, textarea, select, #modal-question, #tab-bank, .selectable-text {
            user-select: text !important;
            -webkit-user-select: text !important;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-slate-100">

<header class="bg-brand-900 text-white shadow-lg sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('tryout')">
                <div class="bg-white/10 p-1 rounded-xl flex items-center justify-center w-11 h-11 border border-white/20 shadow overflow-hidden">
                    <img src="https://raw.githubusercontent.com/anumukmin/tryout2026/fa43cda08e3610ca170f63a90d1d8caa37dc6d71/logo_smkn_1_bulakamba-removebg-preview.png" alt="Logo SMKN 1 Bulakamba" class="w-9 h-9 object-contain">
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">TRY OUT TKA 2026</h1>
                    <p class="text-xs text-brand-100 font-medium">SMK NEGERI 1 BULAKAMBA</p>
                </div>
            </div>

            <nav class="hidden md:flex space-x-2 items-center">
                <button id="nav-login-btn" type="button" onclick="showAdminAuthModal()" class="px-4 py-2 rounded-lg text-sm font-semibold bg-amber-500 hover:bg-amber-600 text-slate-900 border border-amber-400 flex items-center gap-2 shadow">
                    <i class="fa-solid fa-user-lock"></i> Mode Koordinator
                </button>
                <button id="nav-bank" onclick="switchTab('bank')" style="display: none;" class="nav-btn px-4 py-2 rounded-lg text-sm font-medium hover:bg-brand-700 text-brand-100 flex items-center gap-2">
                    <i class="fa-solid fa-book-open"></i> Bank Soal & Input
                </button>
                <button id="nav-results" onclick="switchTab('results')" style="display: none;" class="nav-btn px-4 py-2 rounded-lg text-sm font-medium hover:bg-brand-700 text-brand-100 flex items-center gap-2">
                    <i class="fa-solid fa-square-poll-vertical"></i> Hasil Ujian (Cloud)
                </button>
            </nav>
        </div>
    </div>
</header>

<main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
    <section id="tab-tryout" class="tab-content relative">
        <div id="student-login-card" class="max-w-md mx-auto bg-white rounded-3xl shadow-xl border border-slate-200 p-6 sm:p-8 my-8">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-extrabold text-slate-800">TRY OUT TKA 2026</h2>
                <p class="text-brand-600 font-bold text-xs uppercase mt-1">SMK NEGERI 1 BULAKAMBA</p>
            </div>
            <form id="student-login-form" onsubmit="handleStudentLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Username</label>
                    <input type="text" id="login-username" required placeholder="Masukkan Username" class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm font-semibold">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Password (6 Digit)</label>
                    <input type="password" id="login-password" maxlength="6" required placeholder="Password Ujian" class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm font-bold tracking-widest">
                </div>
                <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3.5 rounded-xl text-sm">Masuk Ujian</button>
            </form>
        </div>

        <div id="student-prep-card" style="display: none;" class="max-w-2xl mx-auto bg-white rounded-3xl shadow-xl border border-slate-200 p-6 sm:p-9">
            <div class="space-y-4">
                <h3 class="text-xl font-bold text-slate-800">Persiapan Ujian</h3>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Pilih Subtes</label>
                    <select id="exam-subtest-filter" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm font-semibold">
                        <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                        <option value="Matematika">Matematika</option>
                        <option value="Bahasa Inggris">Bahasa Inggris</option>
                        <option value="Kewirausahaan">Kewirausahaan</option>
                        <option value="Program Keahlian">Program Keahlian Jurusan</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Token Ujian</label>
                    <input type="text" id="exam-token-input" required placeholder="Token dari Pengawas" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 font-mono font-bold uppercase text-sm">
                </div>
                <button onclick="handleStartExam(event)" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3.5 rounded-xl text-base">Mulai Ujian Now</button>
            </div>
        </div>

        <div id="cbt-screen" style="display: none;" class="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden flex flex-col min-h-[600px]">
            <div class="bg-slate-900 text-white p-4 flex justify-between items-center">
                <div>
                    <span id="cbt-student-display" class="font-bold text-lg">Siswa</span>
                    <p id="cbt-subtest-display" class="text-xs text-slate-400">Subtes</p>
                </div>
                <div class="bg-slate-800 px-4 py-2 rounded-xl text-amber-300 font-mono text-xl font-bold" id="exam-timer">00:00:00</div>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-4 p-6 gap-6">
                <div class="lg:col-span-3">
                    <div id="q-stimulus-container" style="display: none;" class="mb-4 p-4 bg-amber-50 border rounded-xl text-sm">
                        <div id="q-stimulus-text" class="whitespace-pre-line"></div>
                    </div>
                    <div id="q-text" class="text-slate-800 font-semibold text-lg mb-6"></div>
                    <div id="q-options" class="space-y-3"></div>
                    <div class="mt-8 flex justify-between">
                        <button onclick="prevQuestion()" id="btn-prev-q" class="px-5 py-2.5 bg-slate-200 rounded-xl font-bold">Sebelumnya</button>
                        <button onclick="nextQuestion()" id="btn-next-q" class="px-5 py-2.5 bg-brand-600 text-white rounded-xl font-bold">Berikutnya</button>
                        <button onclick="finishExam(false)" id="btn-submit-q" style="display: none;" class="px-6 py-2.5 bg-emerald-600 text-white rounded-xl font-bold">Selesai</button>
                    </div>
                </div>
                <div class="bg-slate-50 p-4 rounded-xl border">
                    <h4 class="font-bold text-sm mb-3">Navigasi Soal</h4>
                    <div id="q-grid-nav" class="grid grid-cols-5 gap-2"></div>
                </div>
            </div>
        </div>
    </section>

    <section id="tab-bank" class="tab-content hidden space-y-4">
        <div class="flex justify-between items-center bg-white p-4 rounded-2xl border">
            <select id="bank-filter-subtest" onchange="renderBankTable()" class="p-2 border rounded-xl text-xs font-bold">
                <option value="ALL">Semua Mata Pelajaran</option>
                <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                <option value="Matematika">Matematika</option>
                <option value="Bahasa Inggris">Bahasa Inggris</option>
            </select>
            <span class="text-xs font-bold">Total Soal: <strong id="bank-total-count">0</strong></span>
        </div>
        <div class="bg-white rounded-2xl border overflow-hidden">
            <table class="w-full text-left text-xs">
                <thead class="bg-slate-100 border-b">
                    <tr>
                        <th class="p-3">No</th>
                        <th class="p-3">Subtes</th>
                        <th class="p-3">Pertanyaan</th>
                        <th class="p-3 text-center">Kunci</th>
                    </tr>
                </thead>
                <tbody id="bank-table-body" class="divide-y"></tbody>
            </table>
        </div>
    </section>
</main>

<!-- MODAL ADMIN AUTH -->
<div id="modal-admin-auth" style="display: none;" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60">
    <div class="bg-white p-6 rounded-3xl max-w-sm w-full text-center">
        <h3 class="font-bold text-lg mb-2">Akses Koordinator</h3>
        <input type="password" id="admin-pin-input" placeholder="Masukkan PIN" class="w-full p-2.5 border rounded-xl text-center font-bold mb-4">
        <button onclick="submitAdminAuth()" class="w-full bg-brand-600 text-white py-2 rounded-xl font-bold">Masuk</button>
    </div>
</div>

<script>
    const ADMIN_PIN = "505609";
    let questionsData = [];
    let currentExamQuestions = [];
    let studentAnswers = {};
    let currentQIndex = 0;
    let bankCurrentPage = 1;
    const BANK_PER_PAGE = 200; // DIUBAH MENJADI 200 AGAR SELURUH SOAL TERBACA LENGKAP

    function showAdminAuthModal() {
        document.getElementById('modal-admin-auth').style.display = 'flex';
    }

    function submitAdminAuth() {
        const pin = document.getElementById('admin-pin-input').value;
        if (pin === ADMIN_PIN) {
            document.getElementById('modal-admin-auth').style.display = 'none';
            document.getElementById('nav-bank').style.display = 'inline-flex';
            switchTab('bank');
        } else {
            alert('PIN Salah!');
        }
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
        document.getElementById('tab-' + tab).classList.remove('hidden');
        if (tab === 'bank') renderBankTable();
    }

    function sanitizeText(str) {
        if (!str || typeof str !== 'string') return str || '';
        return str.replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function handleStudentLogin(e) {
        e.preventDefault();
        document.getElementById('student-login-card').style.display = 'none';
        document.getElementById('student-prep-card').style.display = 'block';
    }

    function handleStartExam(e) {
        e.preventDefault();
        const subtest = document.getElementById('exam-subtest-filter').value;
        currentExamQuestions = questionsData.filter(q => q.category === subtest || subtest === 'Program Keahlian');
        if (currentExamQuestions.length === 0) {
            currentExamQuestions = questionsData; // fallback
        }
        document.getElementById('student-prep-card').style.display = 'none';
        document.getElementById('cbt-screen').style.display = 'flex';
        renderQuestion();
        renderNav();
    }

    function renderQuestion() {
        if (currentExamQuestions.length === 0) return;
        const q = currentExamQuestions[currentQIndex];
        document.getElementById('q-text').innerHTML = sanitizeText(q.question);
        
        const optBox = document.getElementById('q-options');
        optBox.innerHTML = '';
        ['A', 'B', 'C', 'D', 'E'].forEach(letter => {
            if (!q.options || !q.options[letter]) return;
            const isSelected = studentAnswers[q.id] === letter;
            const div = document.createElement('div');
            div.className = `p-3 rounded-xl border cursor-pointer font-medium ${isSelected ? 'bg-brand-50 border-brand-500 font-bold' : 'bg-white'}`;
            div.onclick = () => {
                studentAnswers[q.id] = letter;
                renderQuestion();
                renderNav();
            };
            div.innerHTML = `<b>${letter}.</b> ${sanitizeText(q.options[letter])}`;
            optBox.appendChild(div);
        });

        document.getElementById('btn-prev-q').disabled = (currentQIndex === 0);
        if (currentQIndex === currentExamQuestions.length - 1) {
            document.getElementById('btn-next-q').style.display = 'none';
            document.getElementById('btn-submit-q').style.display = 'inline-block';
        } else {
            document.getElementById('btn-next-q').style.display = 'inline-block';
            document.getElementById('btn-submit-q').style.display = 'none';
        }
    }

    function renderNav() {
        const grid = document.getElementById('q-grid-nav');
        grid.innerHTML = '';
        currentExamQuestions.forEach((q, idx) => {
            const btn = document.createElement('button');
            const isAns = !!studentAnswers[q.id];
            btn.className = `h-9 rounded-lg border font-bold text-xs ${idx === currentQIndex ? 'ring-2 ring-brand-500' : ''} ${isAns ? 'bg-brand-600 text-white' : 'bg-white'}`;
            btn.textContent = idx + 1;
            btn.onclick = () => { currentQIndex = idx; renderQuestion(); renderNav(); };
            grid.appendChild(btn);
        });
    }

    function nextQuestion() { if (currentQIndex < currentExamQuestions.length - 1) { currentQIndex++; renderQuestion(); renderNav(); } }
    function prevQuestion() { if (currentQIndex > 0) { currentQIndex--; renderQuestion(); renderNav(); } }

    function renderBankTable() {
        const tbody = document.getElementById('bank-table-body');
        if (!tbody) return;
        const filterVal = document.getElementById('bank-filter-subtest').value;
        const filtered = filterVal === 'ALL' ? questionsData : questionsData.filter(q => q.category === filterVal);
        document.getElementById('bank-total-count').textContent = filtered.length;

        tbody.innerHTML = '';
        filtered.forEach((q, idx) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="p-3 font-bold">${idx + 1}</td>
                <td class="p-3">${q.category || '-'}</td>
                <td class="p-3">${sanitizeText(q.question)}</td>
                <td class="p-3 text-center font-bold text-emerald-600">${q.correct || '-'}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    window.onload = function() {
        const local = localStorage.getItem('tryout_bank_questions');
        if (local) {
            try { questionsData = JSON.parse(local); } catch(e) {}
        }
    };
</script>
</body>
</html>
